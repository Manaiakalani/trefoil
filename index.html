<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="trefoil" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'"
    />
    <meta name="color-scheme" content="light" />
    <title>trefoil</title>
    <link rel="canonical" href="https://manaiakalani.github.io/trefoil/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="A live 3D rainbow trefoil — one loop, three crossings. Recast it as a word or a logo."
    />
    <meta property="og:title" content="trefoil" />
    <meta
      property="og:description"
      content="A live 3D rainbow trefoil — one loop, three crossings. Recast it as a word or a logo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://manaiakalani.github.io/trefoil/" />
    <meta property="og:image" content="https://manaiakalani.github.io/trefoil/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="trefoil" />
    <meta
      name="twitter:description"
      content="A live 3D rainbow trefoil — one loop, three crossings."
    />
    <meta name="twitter:image" content="https://manaiakalani.github.io/trefoil/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/poster.jpg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="frame">
        <img
          id="poster"
          src="/poster.jpg"
          width="1920"
          height="1080"
          alt="Rainbow trefoil knot on a white studio floor"
        />
        <canvas id="stage" aria-label="Live trefoil" hidden></canvas>
      </div>
    </div>

    <header class="mark" data-chrome>
      <h1 class="word" translate="no">trefoil</h1>
      <p class="aside" id="aside">one loop, three crossings</p>
      <div class="subjects" role="tablist" aria-label="Subject">
        <button id="sub-knot" type="button" role="tab" aria-selected="true">Knot</button>
        <button id="sub-word" type="button" role="tab" aria-selected="false">Word</button>
        <button id="sub-mark" type="button" role="tab" aria-selected="false">Mark</button>
      </div>
      <div class="families" id="families" role="tablist" aria-label="Knot">
        <button id="knot-trefoil" type="button" role="tab" aria-selected="true">Trefoil</button>
        <button id="knot-eight" type="button" role="tab" aria-selected="false">Eight</button>
        <button id="knot-cinq" type="button" role="tab" aria-selected="false">Cinq</button>
      </div>
    </header>

    <div class="composer" id="composer" data-chrome hidden>
      <label class="sr-only" for="word-input">Word or character</label>
      <input
        id="word-input"
        name="word"
        type="text"
        maxlength="48"
        placeholder="Type a word or character…"
        autocomplete="off"
        spellcheck="false"
        hidden
      />
      <label class="upload" id="upload-label" hidden>
        <span id="upload-copy">Drop a logo, or choose a file</span>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" />
      </label>
    </div>

    <div class="tools" data-chrome>
      <label class="spectrum">
        <span>spectrum</span>
        <input id="hue" type="range" min="0" max="1000" value="0" step="1" aria-label="Hue" />
      </label>
    </div>

    <div class="dock" data-chrome>
      <button id="play" type="button" aria-label="Pause" aria-pressed="true">
        <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1" />
          <rect x="14" y="5" width="4" height="14" rx="1" />
        </svg>
        <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5-11-6.5z" />
        </svg>
      </button>
      <p class="clock" aria-live="off">
        <span id="time">00.0</span><span class="total"> / 22.9</span>
      </p>
      <div class="actions">
        <button id="speed" type="button" aria-label="Speed 1×">1×</button>
        <button id="copy" type="button">Copy link</button>
        <details class="menu" id="save-menu">
          <summary>Save</summary>
          <div class="menu-list">
            <button id="shot" type="button">Frame</button>
            <button id="export-glb" type="button">GLB</button>
            <button id="export-stl" type="button">STL</button>
          </div>
        </details>
        <button id="full" type="button">Full screen</button>
        <button id="help" type="button" aria-haspopup="dialog" aria-controls="sheet">Keys</button>
      </div>
    </div>

    <button class="hint" id="hint" type="button" data-chrome hidden>
      Press <kbd>?</kbd> for keys
    </button>

    <label class="sr-only" for="scrub">Playhead</label>
    <input
      id="scrub"
      class="scrub"
      type="range"
      min="0"
      max="10000"
      value="0"
      step="1"
      data-chrome
    />

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <form method="dialog">
        <p class="sheet-title" id="sheet-title">Keys</p>
        <dl>
          <div><dt>space</dt><dd>play or pause</dd></div>
          <div><dt>k / w / m</dt><dd>knot, word, or mark</dd></div>
          <div><dt>t / e / c</dt><dd>trefoil, eight, or cinq</dd></div>
          <div><dt>← →</dt><dd>nudge time</dd></div>
          <div><dt>[ ]</dt><dd>nudge spectrum</dd></div>
          <div><dt>1 2 3</dt><dd>half, normal, double speed</dd></div>
          <div><dt>s</dt><dd>save frame</dd></div>
          <div><dt>l</dt><dd>copy link</dd></div>
          <div><dt>0</dt><dd>reset camera</dd></div>
          <div><dt>h</dt><dd>hide chrome</dd></div>
          <div><dt>?</dt><dd>this list</dd></div>
        </dl>
        <button type="submit" class="sheet-close">Close</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
